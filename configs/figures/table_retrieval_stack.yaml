# @package _global_
defaults:
  - _table
  - _self_
output_subdir: stack_benchmark_table
output_name: retrieval_stack_benchmark_table
figure_width: 19.0
min_height: 7.0
height_scale: 0.72
# The original stack notebook compares one saved run per configuration.
seeds:
  - ${base_seed}
# Retain unavailable configurations as empty cells; error requires complete data.
missing_rows: keep
selected_stacks: null
# Keys are exact CSV configuration IDs without seed suffixes. model refers to
# the raw backbone key in the shared models mapping; labels are explicit text.
