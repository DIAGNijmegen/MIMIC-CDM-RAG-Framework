# Inspect the aggregate pickles produced by evaluate_cdm_rag.py.
defaults:
  - paths: example
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

analysis_dir: ${base_mimic}/logs/analysis
output_dir: ${analysis_dir}/output
id_difficulty_path: ${base_mimic}/id_difficulty.pkl

# Exact model labels from the aggregate *_evals.pkl and *_results.pkl files.
models:
  - gemma-2-9b-it-exl2-4.0bpw
  - gemma-2-9b-it-exl2-4.0bpw_Qwen3-Embedding-0.6B_md_febstep_boosted_medcpt_rerank

experiments: [CDM_VANILLA]
pathologies:
  - appendicitis
  - cholecystitis
  - diverticulitis
  - pancreatitis
difficulty: first_diag
diagnosis_score: Gracious Diagnosis

# Always expand unsuffixed model labels using only the selected saved seeds.
# Include base_seed to select the original run; other seeds have _SEED= suffixes.
base_seed: 2023
seeds: [2023]
  - 2023

skip_missing_model_files: true
validation_tolerance: 1.0e-12

# The exporter writes only CSVs; disable Hydra's log/config sidecars.
hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
