# @package _global_
defaults:
  - _self_

rag_name: Qwen3-Embedding-0.6B_MedCPT_rerank
rag_embedding_model: Qwen3-Embedding-0.6B

#Embedding model parameters
rag_chunk_size: 512
rag_chunk_overlap: 52

rag_embed_max_length: 2048

rag_requery: True
rag_requery_max_length: 1536
rag_requery_only_last_report: False #Only use the last report for requerying

#Retrieval parameters
rag_top_k: 60
rag_prompt_name: "query"

rag_re_rank: True
rag_re_rank_model: MedCPT-Cross-Encoder
rag_top_k_rerank: 6

rag_vector_store_use_bm25: True
rag_retrieval_hybrid_bm25: True
rag_retrieval_hybrid_bm25_alpha: 0.65 # Ratio of dense, rest is BM25
rag_retrieval_hybrid_bm25_top_k: 60 # BM25 candidate pool

#Lost-in-the-middle prevention
rag_u_ordering: True 

#Skip first retrieval step to allow the agent to gather some initial information first.
rag_skip_first_retrieval: True

# Document paths for retrieval
rag_documents:
  - /markdown_cleaned/cdm_appendicitis_s13017-020-00306-3.md
  - /markdown_cleaned/cdm_cholecystitis_s13017-020-00336-x.md
