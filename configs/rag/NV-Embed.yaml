# @package _global_
defaults:
  - _self_

rag_name: NV-Embed-v2-pdf_requery
rag_embedding_model: NV-Embed-v2

#Embedding model parameters
rag_chunk_size: 512
rag_chunk_overlap: 52

rag_embed_max_length: 4096

rag_requery: True
rag_requery_max_length: 1536
rag_requery_only_last_report: False #Only use the last report for requerying

#Retrieval parameters
rag_top_k: 60
rag_prompt_name: "None"

rag_re_rank: False
rag_re_rank_model:
rag_top_k_rerank: 6

rag_vector_store_use_bm25: True
rag_retrieval_hybrid_bm25: True
rag_retrieval_hybrid_bm25_alpha: 0.65 # Ratio of dense, rest is BM25
rag_retrieval_hybrid_bm25_top_k: 60 # BM25 candidate pool

#Lost-in-the-middle prevention
rag_u_ordering: True 

#Skip first retrieval step to allow the agent to gather some initial information first.
rag_skip_first_retrieval: True

# Document paths for retrieval
rag_documents:
  - /pdf/cdm_appendicitis_s13017-020-00306-3.pdf
  - /pdf/cdm_cholecystitis_s13017-020-00336-x.pdf
  - /pdf/cdm_diverticulitis_the_american_society_of_colon_and_rectal_surgeons.6.pdf
  - /pdf/cdm_pancreatitis_s13017-019-0247-0.pdf
  - /pdf/aafp_appendicitis_aafp.org_0701_p25.pdf
  - /pdf/idsa_appendicitis_ciae348.pdf
  - /pdf/sages_appendicitis_sages.org-Guideline for the Diagnosis and Treatment of Appendicitis.pdf
  - /pdf/jcm_cholecystitis_jcm-13-02695-v2.pdf
  - /pdf/nice_cholecystitis_gallstone-disease-pdf-75545237643973.pdf
  - /pdf/tokyo_cholecystitis_J Hepato Biliary Pancreat - 2017 - Yokoe - Tokyo Guidelines 2018 diagnostic criteria and severity grading of acute.pdf
  - /pdf/aga_diverticulitis_PIIS0016508520355128.pdf
  - /pdf/euro_diverticulitis_Colorectal Disease - 2020 - Schultz - European Society of Coloproctology guidelines for the management of diverticular.pdf
  - /pdf/nice_diverticulitis_diverticular-disease-diagnosis-and-management-pdf-66141784856005.pdf
  - /pdf/bspghan_pancreatitis-frontline-gastro-review.pdf
  - /pdf/iap_pancreatitis_IAP_APA_Evidence-based_Guidelines_Management_Acute_Pancreatitis_-_Pancreatology_2013.pdf
  - /pdf/nice_pancreatitis-pdf-66141537952453.pdf